<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Kas Komunitas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js in the repo root; npm run build compiles it to
       public/tailwind.css on every image build, so the stylesheet is
       regenerated from THIS commit's markup and can never drift behind
       the code. Writing class names as whole literals keeps this working. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       Not conditional on calling a bridge API: it is also how the app
       ANSWERS the shell (offline launch, page colour, theme forwarding). -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <script>
    // Dark mode follows the platform's theme setting (Light/Dark/System in
    // the shell). prefers-color-scheme inside a cross-origin iframe sees the
    // OS, not the viewer's choice, so the bridge forwards the resolved
    // theme instead; the OS preference is the standalone fallback.
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme)
          || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
  <style>
    #monthbar { scrollbar-width: none; }
    #monthbar::-webkit-scrollbar { display: none; }
    .backdrop {
      position: fixed; inset: 0; z-index: 30;
      background: rgb(0 0 0 / 0.5);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      transform: translateY(102%);
      visibility: hidden;
      transition: transform 0.25s ease, visibility 0.25s;
    }
    .sheet.open { transform: translateY(0); visibility: visible; }
    .fab { bottom: calc(1rem + var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px))); }
    .sheet-pad { padding-bottom: calc(1.25rem + var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px))); }
    @media (prefers-reduced-motion: reduce) {
      .sheet, .backdrop { transition: none; }
    }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen antialiased">
  <main class="max-w-md mx-auto px-4 pb-28 pt-6">

    <!-- Balance header: the one number the app exists for, plus the
         selected period's totals. -->
    <section class="rounded-2xl border border-violet-500/30 bg-gradient-to-b from-violet-600/20 to-transparent p-5">
      <p class="text-sm font-medium text-zinc-500">Saldo</p>
      <p id="balance" class="mt-1 text-3xl font-bold tracking-tight tabular-nums">Rp 0</p>
      <div class="mt-4 flex items-center justify-between gap-3 text-sm">
        <p id="period-label" class="text-zinc-500">Semua waktu</p>
        <p class="text-zinc-500">
          Masuk <span id="total-income" class="font-semibold text-emerald-600 dark:text-emerald-400 tabular-nums">+Rp 0</span>
          <span class="mx-1 text-zinc-400 dark:text-zinc-600">·</span>
          Keluar <span id="total-expense" class="font-semibold text-red-600 dark:text-red-400 tabular-nums">−Rp 0</span>
        </p>
      </div>
    </section>

    <!-- Month filter: horizontally scrollable chips, thumb-reachable. -->
    <div id="monthbar" class="-mx-4 mt-4 flex gap-2 overflow-x-auto px-4 py-1"></div>

    <section class="mt-4">
      <h2 class="mb-2 px-1 text-sm font-medium text-zinc-500">Riwayat</h2>
      <div id="ledger" class="rounded-xl border border-zinc-200 bg-white divide-y divide-zinc-200 dark:border-zinc-800 dark:bg-zinc-900/60 dark:divide-zinc-800">
        <p class="px-4 py-6 text-center text-sm text-zinc-500">Memuat…</p>
      </div>
    </section>

    <p class="mt-6 text-center text-xs text-zinc-400 dark:text-zinc-600">Kas bersama: semua anggota melihat dan menambah catatan.</p>
  </main>

  <!-- Add entry: FAB in thumb reach, opens the bottom sheet. -->
  <button id="fab" aria-label="Tambah catatan" class="fab fixed right-4 z-20 flex h-14 w-14 items-center justify-center rounded-full bg-violet-600 text-white shadow-lg shadow-violet-600/30 transition-transform active:scale-95">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="backdrop" class="backdrop"></div>

  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="mx-auto max-w-md rounded-t-2xl border border-b-0 border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-900">
      <div class="mx-auto mt-3 h-1 w-10 rounded-full bg-zinc-300 dark:bg-zinc-700"></div>
      <h2 id="sheet-title" class="px-5 pt-3 text-lg font-semibold">Tambah Catatan</h2>
      <form id="entry-form" class="sheet-pad flex flex-col gap-4 p-5">
        <div class="grid grid-cols-2 gap-1 rounded-xl bg-zinc-200/70 p-1 dark:bg-zinc-800">
          <button type="button" data-type="income" class="type-btn rounded-lg py-2 text-sm font-semibold text-zinc-500 dark:text-zinc-400">+ Pemasukan</button>
          <button type="button" data-type="expense" class="type-btn rounded-lg py-2 text-sm font-semibold text-zinc-500 dark:text-zinc-400">− Pengeluaran</button>
        </div>

        <div>
          <label for="amount" class="mb-1 block text-sm font-medium text-zinc-500">Nominal</label>
          <div class="relative">
            <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-zinc-500">Rp</span>
            <input id="amount" inputmode="numeric" autocomplete="off" placeholder="0"
              class="w-full rounded-xl border border-zinc-300 bg-transparent py-3 pl-11 pr-4 text-lg font-semibold tabular-nums outline-none focus:border-violet-500 dark:border-zinc-700">
          </div>
        </div>

        <div>
          <label for="note" class="mb-1 block text-sm font-medium text-zinc-500">Catatan (opsional)</label>
          <input id="note" maxlength="200" autocomplete="off" placeholder="Untuk apa kas ini?"
            class="w-full rounded-xl border border-zinc-300 bg-transparent px-4 py-3 text-base outline-none focus:border-violet-500 dark:border-zinc-700">
        </div>

        <div>
          <label for="date" class="mb-1 block text-sm font-medium text-zinc-500">Tanggal</label>
          <input id="date" type="date"
            class="w-full rounded-xl border border-zinc-300 bg-transparent px-4 py-3 text-base outline-none focus:border-violet-500 dark:border-zinc-700 dark:[color-scheme:dark]">
        </div>

        <p id="form-error" class="hidden text-sm text-red-600 dark:text-red-400"></p>

        <button id="save-btn" type="submit" class="rounded-xl bg-violet-600 py-3 text-base font-semibold text-white transition-colors hover:bg-violet-500">Simpan</button>
      </form>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};

    const fmt = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 });
    const MONTH_RE = /^\d{4}-(0[1-9]|1[0-2])$/;

    let currentMonth = params.get('month') || 'all';
    if (currentMonth !== 'all' && !MONTH_RE.test(currentMonth)) currentMonth = 'all';
    let entryType = 'expense';

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function monthLabel(ym, opts) {
      const [y, m] = ym.split('-').map(Number);
      return new Date(y, m - 1, 1).toLocaleDateString('id-ID', opts);
    }

    function dateLabel(ymd) {
      const [y, m, d] = ymd.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function signedAmount(type, amount) {
      return (type === 'income' ? '+' : '−') + fmt.format(amount);
    }

    // The active chip comes first so the row starts scrolled to it.
    function renderMonthBar() {
      const bar = document.getElementById('monthbar');
      const now = new Date();
      const months = [];
      for (let i = 0; i < 6; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
      }
      if (currentMonth !== 'all' && !months.includes(currentMonth)) months.unshift(currentMonth);

      const chip = (value, label) => {
        const active = currentMonth === value;
        return '<button type="button" data-month="' + value + '" class="whitespace-nowrap rounded-full border px-3 py-1.5 text-sm font-medium ' +
          (active
            ? 'border-transparent bg-violet-600 text-white'
            : 'border-zinc-200 bg-white text-zinc-600 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-300') +
          '">' + esc(label) + '</button>';
      };

      bar.innerHTML =
        chip('all', 'Semua') +
        months.map((m) => chip(m, monthLabel(m, { month: 'short', year: 'numeric' }))).join('');

      bar.querySelectorAll('[data-month]').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentMonth = btn.dataset.month;
          renderMonthBar();
          load();
        });
      });

      const active = bar.querySelector('[data-month="' + currentMonth + '"]');
      if (active) active.scrollIntoView({ block: 'nearest', inline: 'center' });
    }

    function periodLabel() {
      return currentMonth === 'all'
        ? 'Semua waktu'
        : monthLabel(currentMonth, { month: 'long', year: 'numeric' });
    }

    async function load() {
      const el = document.getElementById('ledger');
      document.getElementById('period-label').textContent = periodLabel();
      // No token means this page was opened outside the platform shell:
      // the auth-gated API cannot answer, so say why instead of failing.
      if (!token) {
        el.innerHTML = '<p class="px-4 py-8 text-center text-sm text-zinc-500">Buka aplikasi ini dari dalam Homeroom untuk melihat dan menambah catatan kas.</p>';
        return;
      }
      try {
        const q = currentMonth === 'all' ? '' : '?month=' + currentMonth;
        const res = await fetch('/api/entries' + q, { headers });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        document.getElementById('balance').textContent = fmt.format(data.balance);
        document.getElementById('total-income').textContent = '+' + fmt.format(data.income);
        document.getElementById('total-expense').textContent = '−' + fmt.format(data.expense);

        if (!data.entries.length) {
          el.innerHTML = '<p class="px-4 py-8 text-center text-sm text-zinc-500">Belum ada catatan' +
            (currentMonth === 'all' ? '.' : ' bulan ini.') +
            ' Ketuk tombol + untuk menambah catatan pertama.</p>';
          return;
        }

        el.innerHTML = data.entries.map((r) =>
          '<div class="flex items-center justify-between gap-3 px-4 py-3.5">' +
            '<div class="min-w-0">' +
              '<p class="truncate text-sm font-medium">' + esc(r.note || '(tanpa catatan)') + '</p>' +
              '<p class="text-xs text-zinc-500">' + esc(dateLabel(r.occurred_on)) + ' · ' + esc(r.username) + '</p>' +
            '</div>' +
            '<p class="shrink-0 text-sm font-semibold tabular-nums ' +
              (r.type === 'income'
                ? 'text-emerald-600 dark:text-emerald-400'
                : 'text-red-600 dark:text-red-400') +
              '">' + signedAmount(r.type, Number(r.amount)) + '</p>' +
          '</div>'
        ).join('');
      } catch (err) {
        el.innerHTML = '<p class="px-4 py-8 text-center text-sm text-zinc-500">Gagal memuat data. <button type="button" id="retry" class="font-semibold text-violet-600 dark:text-violet-400 underline underline-offset-2">Coba lagi</button></p>';
        const retry = document.getElementById('retry');
        if (retry) retry.addEventListener('click', load);
      }
    }

    // --- Add-entry sheet ---

    const sheet = document.getElementById('sheet');
    const backdrop = document.getElementById('backdrop');
    const form = document.getElementById('entry-form');
    const amountInput = document.getElementById('amount');
    const noteInput = document.getElementById('note');
    const dateInput = document.getElementById('date');
    const formError = document.getElementById('form-error');
    const saveBtn = document.getElementById('save-btn');

    function showError(msg) {
      formError.textContent = msg;
      formError.classList.remove('hidden');
    }

    function setType(type) {
      entryType = type;
      document.querySelectorAll('.type-btn').forEach((btn) => {
        const on = btn.dataset.type === type;
        btn.classList.toggle('bg-white', on);
        btn.classList.toggle('dark:bg-zinc-700', on);
        btn.classList.toggle('text-zinc-900', on);
        btn.classList.toggle('dark:text-white', on);
        btn.classList.toggle('text-zinc-500', !on);
        btn.classList.toggle('dark:text-zinc-400', !on);
      });
    }

    function openSheet() {
      form.reset();
      formError.classList.add('hidden');
      setType('expense');
      dateInput.value = new Date().toLocaleDateString('en-CA');
      sheet.classList.add('open');
      backdrop.classList.add('open');
      amountInput.focus({ preventScroll: true });
    }

    function closeSheet() {
      sheet.classList.remove('open');
      backdrop.classList.remove('open');
    }

    document.getElementById('fab').addEventListener('click', openSheet);
    backdrop.addEventListener('click', closeSheet);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

    document.querySelectorAll('.type-btn').forEach((btn) => {
      btn.addEventListener('click', () => setType(btn.dataset.type));
    });

    // Keep the amount field digits-only: id-ID has no decimals in daily use,
    // and the server stores integer rupiah.
    amountInput.addEventListener('input', () => {
      const digits = amountInput.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
      if (digits !== amountInput.value) amountInput.value = digits;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formError.classList.add('hidden');
      const amount = Number(amountInput.value.replace(/\D/g, ''));
      if (!Number.isInteger(amount) || amount <= 0) {
        showError('Isi nominal lebih dari 0');
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Menyimpan…';
      try {
        const res = await fetch('/api/entries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ type: entryType, amount, note: noteInput.value, date: dateInput.value }),
        });
        if (!res.ok) {
          const j = await res.json().catch(() => ({}));
          showError(j.error || 'Gagal menyimpan. Coba lagi.');
          return;
        }
        closeSheet();
        load();
      } catch (err) {
        showError('Gagal menyimpan. Coba lagi.');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Simpan';
      }
    });

    renderMonthBar();
    load();
  </script>
</body>
</html>
